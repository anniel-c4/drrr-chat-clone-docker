server {
    listen 80;
    server_name _;
    sendfile off;
    server_tokens off;

    port_in_redirect off;
    absolute_redirect off;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    add_header X-content-Type-Options "nosniff";
    add_header X-Frame-Options "SMAORIGIN";
    # ドキュメントルートを drrr-like-chat 直下に設定
    root /var/www/html/drrr-like-chat;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHPファイルの処理設定
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        # $document_root を使うことで Nginx の root 設定（/var/www/html/drrr-like-chat）をそのまま渡す
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # セキュリティ設定 (trust_path への直接アクセス制限)
    location ~ /trust_path/ {
        deny all;
        return 404;
    }
}