server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # サブディレクトリ配下のルーティング
    location /drrr-like-chat/ {
        try_files $uri $uri/ /drrr-like-chat/index.php?$query_string;
    }

    # PHP-FPMへの転送設定
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ★ trust_path への直接アクセスを完全にブロック（セキュリティ対策）
    location ~ /trust_path/ {
        deny all;
        return 404;
    }

    # 隠しファイル（.htaccess等）へのアクセス拒否
    location ~ /\. {
        deny all;
    }
}