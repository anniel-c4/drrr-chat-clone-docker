version: '3.8'

services:
  # --------------------------------------------------
  # 1. Web サーバー (Nginx)
  # --------------------------------------------------
  web:
    image: nginx:alpine
    container_name: onion-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./app/drrr-like-chat:/var/www/html/drrr-like-chat
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tor-net
    depends_on:
      - php

  # --------------------------------------------------
  # 2. PHP 実行環境
  # --------------------------------------------------
  php:
    image: php:8.2-fpm-alpine
    container_name: onion-php
    restart: always
    volumes:
      - ./app/drrr-like-chat:/var/www/html/drrr-like-chat/
    networks:
      - tor-net

  # --------------------------------------------------
  # 3. Tor 匿名化サービス
  # --------------------------------------------------
  tor:
    build: ./tor
    container_name: onion-tor
    restart: always
    user: "root"
    volumes:
      - ./tor_keys/${APP_ENV:-group_a}:/var/lib/tor/mywebsite
      - ./:/out
    networks:
      - tor-net
    depends_on:
      - web
    entrypoint:
      - sh
      - -c
      - |
        # 1. 親ディレクトリ(/var/lib/tor)と鍵フォルダの所有権・権限を完全root化
        mkdir -p /var/lib/tor/mywebsite
        chown -R root:root /var/lib/tor
        chmod 700 /var/lib/tor
        chmod 700 /var/lib/tor/mywebsite

        # 2. hostname が生成されたら onion_address.txt へ書き出し
        (
          until [ -f /var/lib/tor/mywebsite/hostname ]; do sleep 1; done;
          cp /var/lib/tor/mywebsite/hostname /out/onion_address.txt
          chmod 644 /out/onion_address.txt
          echo "=================================================="
          echo "✅ Onion Address Updated:"
          cat /out/onion_address.txt
          echo "=================================================="
        ) &

        # 3. Tor 起動
        exec tor -f /etc/tor/torrc

networks:
  tor-net:
    driver: bridge