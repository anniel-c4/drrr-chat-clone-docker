version: '3.8'

services:
  # --------------------------------------------------
  # 1. Web サーバー (Nginx)
  # --------------------------------------------------
  web:
    image: nginx:alpine
    container_name: onion-web
    restart: always
    ports:
      # ローカルテスト用: http://localhost:8080 でアクセス可能
      - "8080:80"
    volumes:
      # 【変更】./app/drrr-like-chat を Nginx の root (/var/www/html/drrr-like-chat) に割り当て
      - ./app/drrr-like-chat:/var/www/html/drrr-like-chat:ro
      # Nginx 設定ファイルをコンテナに割り当て
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tor-net
    depends_on:
      - php

  # --------------------------------------------------
  # 2. PHP 実行環境 (fastcgi_pass php:9000 用)
  # --------------------------------------------------
  php:
    image: php:8.2-fpm-alpine
    container_name: onion-php
    restart: always
    volumes:
      # 【変更】PHP コンテナ側にも同じソースコードをマウント
      - ./app/drrr-like-chat:/var/www/html/drrr-like-chat
    networks:
      - tor-net

  # --------------------------------------------------
  # 3. Tor 匿名化サービス
  # --------------------------------------------------
  tor:
      build: ./tor
      container_name: onion-tor
      restart: always
      volumes:
        - ./tor_keys:/var/lib/tor/mywebsite
      networks:
        - tor-net
      depends_on:
        - web

networks:
  tor-net:
    driver: bridge