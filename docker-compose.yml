version: '3.8'

services:
  # --------------------------------------------------
  # 1. Web サーバー (Nginx)
  # --------------------------------------------------
  web:
    image: nginx:alpine
    container_name: onion-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./app/drrr-like-chat:/var/www/html/drrr-like-chat
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tor-net
    depends_on:
      - php

  # --------------------------------------------------
  # 2. PHP 実行環境
  # --------------------------------------------------
  php:
    image: php:8.2-fpm-alpine
    container_name: onion-php
    restart: always
    volumes:
      - ./app/drrr-like-chat:/var/www/html/drrr-like-chat/
    networks:
      - tor-net

  # --------------------------------------------------
  # 3. Tor 匿名化サービス
  # --------------------------------------------------
  tor:
    build: ./tor
    container_name: onion-tor
    restart: always
    volumes:
      # 【変更】.env の APP_ENV に応じて ./tor_keys/group_a または ./tor_keys/group_b をマウント
      - ./tor_keys/${APP_ENV:-group_a}:/var/lib/tor/mywebsite
      - ./:/out
    networks:
      - tor-net
    depends_on:
      - web
    # 【変更】APP_ENV をコンテナ内でも参照できるよう環境変数を渡す
    environment:
      - APP_ENV=${APP_ENV:-group_a}
    entrypoint: >
      sh -c "
        (
          until [ -f /var/lib/tor/mywebsite/hostname ]; do sleep 1; done;
          cp /var/lib/tor/mywebsite/hostname /out/onion_address.txt;
          chmod 644 /out/onion_address.txt;
          echo '==================================================';
          echo '✅ Mode: ['\"$$APP_ENV\"']';
          echo '✅ Onion Address:';
          cat /out/onion_address.txt;
          echo '==================================================';
        ) &
        exec tor -f /etc/tor/torrc
      "

networks:
  tor-net:
    driver: bridge