version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: onion-web
    restart: always
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tor-net

  tor:
    build: ./tor
    container_name: onion-tor
    restart: always
    volumes:
      - ./tor_keys:/var/lib/tor/mywebsite
    networks:
      - tor-net
    depends_on:
      - web

networks:
  tor-net:
    driver: bridge